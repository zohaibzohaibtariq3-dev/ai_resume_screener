# render.yaml
# ─────────────────────────────────────────────────────────────
# Deployment configuration for Render.com
# Place this file in the root of your repo.
# Render will auto-detect and deploy your service.
# ─────────────────────────────────────────────────────────────

services:
  - type: web                            # Web service (has a public URL)
    name: ai-resume-screener-api
    env: python                          # Python runtime
    buildCommand: |
      pip install -r backend/requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health      # Render will ping this to verify the service is alive
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
